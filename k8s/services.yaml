apiVersion: v1
kind: Service
metadata:
  name: alarm-news-crawler
  namespace: alarm-news
  labels:
    app: alarm-news
    component: crawler
spec:
  type: ClusterIP
  selector:
    app: alarm-news
    component: crawler
  ports:
    - name: health
      port: 8080
      targetPort: 8080
      protocol: TCP
---
