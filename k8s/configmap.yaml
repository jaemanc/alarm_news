apiVersion: v1
kind: ConfigMap
metadata:
  name: alarm-news-config
  namespace: alarm-news
  labels:
    app: alarm-news
data:
  # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_NOTIFICATION_TOPIC: "notification-events"
  KAFKA_EMAIL_TOPIC: "email-delivery"
  KAFKA_DLQ_TOPIC: "notification-dlq"
  KAFKA_CONSUMER_GROUP_WORKER: "alarm-news-workers"
  KAFKA_CONSUMER_GROUP_EMAIL: "alarm-news-email-workers"

  # Database Configuration (SQLite - file-based, no server needed)
  DB_BACKEND: "sqlite"
  SQLITE_DB_PATH: "/app/data/alarm_news.db"

  # Redis Configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # SMTP Configuration
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_FROM_EMAIL: "noreply@alarmnews.com"
  SMTP_FROM_NAME: "Alarm News"

  # Crawler Configuration
  CRAWLER_INTERVAL_MINUTES: "360"
  CRAWLER_REQUEST_DELAY_SECONDS: "2"
  CRAWLER_REQUEST_TIMEOUT_SECONDS: "30"

  # Scheduler Configuration
  SCHEDULER_USER_RELOAD_MINUTES: "5"
  SCHEDULER_EVALUATION_INTERVAL_SECONDS: "60"

  # Worker Configuration
  WORKER_LOCK_TTL_SECONDS: "300"
  WORKER_LOCK_TIMEOUT_SECONDS: "10"
  WORKER_SHUTDOWN_GRACE_PERIOD_SECONDS: "60"

  # Health Check Configuration
  HEALTH_CHECK_TIMEOUT_SECONDS: "5"
  HEALTH_CHECK_INACTIVITY_THRESHOLD_MINUTES: "5"

  # Logging Configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # Authentication Configuration
  JWT_EXPIRY_HOURS: "24"
  BCRYPT_COST_FACTOR: "12"

  # Rate Limiting Configuration
  RATE_LIMIT_MAX_ATTEMPTS: "5"
  RATE_LIMIT_WINDOW_MINUTES: "15"
