apiVersion: v1
kind: Secret
metadata:
  name: alarm-news-secrets
  namespace: alarm-news
  labels:
    app: alarm-news
type: Opaque
# Values must be base64 encoded in production
# Use: echo -n 'value' | base64
stringData:
  # Redis Credentials
  REDIS_PASSWORD: "changeme-redis-password"

  # SMTP Credentials
  SMTP_USERNAME: "your-email@gmail.com"
  SMTP_PASSWORD: "changeme-smtp-password"

  # JWT Secret
  JWT_SECRET: "changeme-jwt-secret-key-minimum-32-characters"

  # Resend API Key
  RESEND_API_KEY: "your-resend-api-key"
