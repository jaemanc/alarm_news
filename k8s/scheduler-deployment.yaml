apiVersion: apps/v1
kind: Deployment
metadata:
  name: alarm-news-scheduler
  namespace: alarm-news
  labels:
    app: alarm-news
    component: scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alarm-news
      component: scheduler
  template:
    metadata:
      labels:
        app: alarm-news
        component: scheduler
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: scheduler
          image: alarm-news/scheduler:latest
          ports:
            - containerPort: 8080
              name: health
          envFrom:
            - configMapRef:
                name: alarm-news-config
            - secretRef:
                name: alarm-news-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            periodSeconds: 30
